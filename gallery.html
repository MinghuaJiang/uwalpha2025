<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动照片 — 华大启发活动</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&family=Crimson+Pro:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --warm-red: #c0392b;
    --gold: #d4a843;
    --gold-light: #f0c060;
    --ink: #1a1007;
    --ink-soft: #3d2b1f;
    --paper: #fff9f2;
    --cream: #fdf6ec;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--ink);
    color: var(--paper);
    min-height: 100vh;
  }

  /* ── NAV BAR ─────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,5,2,0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 1.5rem;
    height: 56px;
  }
  .topbar-back {
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.85rem;
    display: flex; align-items: center; gap: 0.4rem;
    transition: color 0.2s;
  }
  .topbar-back:hover { color: var(--gold-light); }
  .topbar-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 1rem;
    color: var(--gold-light);
    font-weight: 600;
  }
  .topbar-sep { color: rgba(255,255,255,0.15); }

  /* ── HERO ────────────────────────────────────────── */
  .page-hero {
    padding: 4rem 2rem 3rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .page-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 80% at 50% 0%, rgba(192,57,43,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .page-hero-label {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--gold);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  .page-hero-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    color: var(--paper);
    margin-bottom: 0.4rem;
  }
  .page-hero-en {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1rem;
    color: rgba(255,255,255,0.35);
  }

  /* ── TABS ────────────────────────────────────────── */
  .tabs-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: rgba(255,255,255,0.4);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.88rem;
    padding: 0.9rem 1.4rem;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    margin-bottom: -1px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .tab-btn:hover { color: rgba(255,255,255,0.75); }
  .tab-btn.active {
    color: var(--gold-light);
    border-bottom-color: var(--gold);
  }

  /* ── ALBUM PANEL ─────────────────────────────────── */
  .album-panel { display: none; }
  .album-panel.active { display: block; }

  .album-meta {
    max-width: 1100px;
    margin: 2rem auto 1.5rem;
    padding: 0 2rem;
    display: flex; align-items: center; gap: 1rem;
    flex-wrap: wrap;
  }
  .album-meta-badge {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2rem;
    padding: 0.35rem 1rem;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
  }
  .album-meta-count {
    color: rgba(255,255,255,0.3);
    font-size: 0.8rem;
  }

  /* masonry grid */
  .photo-grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 2rem 5rem;
    columns: 3;
    column-gap: 0.7rem;
  }
  @media (max-width: 900px) { .photo-grid { columns: 2; } }
  @media (max-width: 480px) { .photo-grid { columns: 1; padding: 0 1rem 3rem; } }

  .photo-item {
    break-inside: avoid;
    margin-bottom: 0.7rem;
    overflow: hidden;
    border-radius: 0.6rem;
    position: relative;
    cursor: pointer;
    background: rgba(255,255,255,0.04);
  }
  .photo-item img {
    width: 100%;
    display: block;
    transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .photo-item:hover img { transform: scale(1.04); }
  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(5,2,1,0.55) 0%, transparent 45%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0.75rem;
  }
  .photo-item:hover .photo-overlay { opacity: 1; }
  .photo-overlay span {
    color: rgba(255,255,255,0.8);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── LIGHTBOX ────────────────────────────────────── */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(4,1,0,0.96);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(14px);
  }
  .lightbox.open { display: flex; }
  .lb-inner {
    position: relative;
    max-width: min(92vw, 1000px);
  }
  .lb-inner img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 0.5rem;
    box-shadow: 0 40px 100px rgba(0,0,0,0.9);
    display: block;
  }
  .lb-close {
    position: absolute; top: -2.5rem; right: 0;
    background: none; border: none;
    color: rgba(255,255,255,0.5);
    font-size: 1.5rem; cursor: pointer;
    transition: color 0.2s; line-height: 1;
  }
  .lb-close:hover { color: white; }
  .lb-nav {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: white;
    width: 2.5rem; height: 2.5rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem;
    transition: background 0.2s;
    backdrop-filter: blur(8px);
  }
  .lb-nav:hover { background: rgba(255,255,255,0.18); }
  .lb-prev { left: -3.5rem; }
  .lb-next { right: -3.5rem; }
  @media (max-width: 600px) {
    .lb-prev { left: 0.4rem; }
    .lb-next { right: 0.4rem; }
  }
  .lb-counter {
    position: absolute; bottom: -1.8rem; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 0.78rem; letter-spacing: 0.1em;
    white-space: nowrap;
  }

  /* ── FOOTER ──────────────────────────────────────── */
  footer {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 2rem;
    text-align: center;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
  }
  footer a { color: rgba(255,255,255,0.35); text-decoration: none; }
  footer a:hover { color: var(--gold-light); }
</style>
</head>
<body>

<!-- top nav -->
<nav class="topbar">
  <a class="topbar-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回首页
  </a>
  <span class="topbar-sep">·</span>
  <span class="topbar-title">活动照片</span>
</nav>

<!-- hero -->
<div class="page-hero">
  <p class="page-hero-label">活动记录</p>
  <h1 class="page-hero-title">活动照片</h1>
  <p class="page-hero-en">Photo Albums · UW Alpha 2025–2026</p>
</div>

<!-- tabs -->
<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchAlbum('session1')">2025/10/11 人生就是如此吗</button>
  <button class="tab-btn" onclick="switchAlbum('ep9')">2026/03/07 怎样活得更精彩</button>
</div>

<!-- album: session1 -->
<div class="album-panel active" id="panel-session1">
  <div class="album-meta">
    <span class="album-meta-badge">📍 UW Newman Center</span>
    <span class="album-meta-badge">📅 2025/10/11</span>
    <span class="album-meta-count" id="count-session1"></span>
  </div>
  <div class="photo-grid" id="grid-session1"></div>
</div>

<!-- album: ep9 -->
<div class="album-panel" id="panel-ep9">
  <div class="album-meta">
    <span class="album-meta-badge">📍 UW Newman Center</span>
    <span class="album-meta-badge">📅 2026/03/07</span>
    <span class="album-meta-count" id="count-ep9"></span>
  </div>
  <div class="photo-grid" id="grid-ep9"></div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" onclick="lbBgClose(event)">
  <div class="lb-inner">
    <button class="lb-close" onclick="closeLb()">✕</button>
    <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>
</div>

<footer>
  <a href="index.html">← 华大启发活动</a> &nbsp;·&nbsp; © 2025–2026 UW Chinese Alpha Team
</footer>

<script>
  const BASE = 'https://raw.githubusercontent.com/MinghuaJiang/uwalpha2025/main/photos';

  const ALBUMS = {
    session1: {
      label: '2025/10/11 人生就是如此吗',
      files: ['s1_01','s1_02','s1_03','s1_04','s1_05','s1_06','s1_07','s1_08','s1_09','s1_10']
    },
    ep9: {
      label: '2026/03/07 怎样活得更精彩',
      files: ['IMG_7576','IMG_7581','IMG_7588','IMG_7592','IMG_7606','IMG_7612','IMG_7621','IMG_7625','IMG_7649','IMG_7652','IMG_7677','IMG_7680','IMG_7685','IMG_7687','IMG_7698']
    }
  };

  const TAB_ORDER = ['session1','ep9'];

  function getUrl(albumKey, file) {
    return `${BASE}/${albumKey}/${file}.jpeg`;
  }

  function buildAlbum(albumKey) {
    const grid = document.getElementById(`grid-${albumKey}`);
    if (grid.children.length > 0) return;
    const album = ALBUMS[albumKey];
    document.getElementById(`count-${albumKey}`).textContent = `${album.files.length} 张照片`;
    album.files.forEach((file, idx) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `
        <img src="${getUrl(albumKey, file)}" alt="" loading="lazy">
        <div class="photo-overlay"><span>查看大图</span></div>
      `;
      item.addEventListener('click', () => openLb(albumKey, idx));
      grid.appendChild(item);
    });
  }

  // build first album immediately
  buildAlbum('session1');

  function switchAlbum(key) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', TAB_ORDER[i] === key);
    });
    document.querySelectorAll('.album-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`panel-${key}`).classList.add('active');
    buildAlbum(key);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Lightbox ──
  let lbKey = '', lbIdx = 0;

  function openLb(albumKey, idx) {
    lbKey = albumKey; lbIdx = idx;
    showLb();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLb() {
    const files = ALBUMS[lbKey].files;
    document.getElementById('lb-img').src = getUrl(lbKey, files[lbIdx]);
    document.getElementById('lb-counter').textContent = `${lbIdx + 1} / ${files.length}`;
  }

  function lbNav(dir) {
    const len = ALBUMS[lbKey].files.length;
    lbIdx = (lbIdx + dir + len) % len;
    showLb();
  }

  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function lbBgClose(e) {
    if (e.target === document.getElementById('lightbox')) closeLb();
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'Escape') closeLb();
  });

  // handle URL hash for direct album link e.g. gallery.html#ep9
  const hash = location.hash.slice(1);
  if (hash && ALBUMS[hash]) switchAlbum(hash);
</script>
</body>
</html>
